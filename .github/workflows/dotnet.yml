name: Build, test and publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  CONFIGURATION: Release
  SOLUTION_PATH: Blackfinch.Lending.sln
  PUBLISH_PATH: ${{ github.workspace }}/artifacts/publish

jobs:
  build-test-publish:
    name: Build, test and publish artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION_PATH"

      - name: Build solution
        run: dotnet build "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-restore

      - name: Run all tests
        run: dotnet test "$SOLUTION_PATH" --configuration "$CONFIGURATION" --no-build --verbosity normal

      - name: Publish service
        run: >-
          dotnet publish src/Blackfinch.Lending/Blackfinch.Lending.csproj
          --configuration "$CONFIGURATION"
          --no-restore
          --output "$PUBLISH_PATH"
          -p:UseAppHost=false

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: blackfinch-lending-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.PUBLISH_PATH }}
          if-no-files-found: error
          retention-days: 14
